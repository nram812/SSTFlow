[workspace]
name = "sst-downscaling"
version = "0.1.0"
description = "Flow matching, autoregressive flow matching, and GAN super-resolution of OFAM sea-surface temperature"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Shared, hardware independent dependencies.  PyTorch itself is pulled in by the
# `cpu` / `gpu` features below because the login nodes on this cluster do not
# expose a CUDA driver and therefore cannot resolve `pytorch-gpu`.
[dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26,<3"
scipy = ">=1.11,<2"
xarray = ">=2024.1"
netcdf4 = ">=1.6,<2"
h5netcdf = ">=1.3,<2"
h5py = ">=3.10,<4"
dask = ">=2024.1"
matplotlib = ">=3.8,<4"
tqdm = ">=4.66,<5"
pytest = ">=8,<9"
imageio-ffmpeg = ">=0.6,<1"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.5,<3"

[feature.gpu]
# Keep CUDA scoped to the GPU environment so the CPU environment remains
# runnable on login nodes without a visible driver. Pixi currently warns that
# this legacy spelling is deprecated, but feature-specific platform objects do
# not yet preserve this two-environment behavior on the installed Pixi version.
system-requirements = { cuda = "12" }

[feature.gpu.dependencies]
pytorch-gpu = ">=2.5,<3"

[environments]
default = { features = ["cpu"], solve-group = "cpu" }
gpu = { features = ["gpu"], solve-group = "gpu" }

[tasks]
# --- validation (CPU, login node or shortq) -----------------------------
test = { cmd = "python -m pytest tests -v", env = { PYTHONPATH = "src", MPLBACKEND = "Agg", OMP_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
test-fast = { cmd = "python -m pytest tests -v -m 'not slow'", env = { PYTHONPATH = "src", MPLBACKEND = "Agg", OMP_NUM_THREADS = "1", MKL_NUM_THREADS = "1" } }
validate-data = { cmd = "python -u src/validate_data.py --config configs/flow_sr.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }

# --- data preparation ---------------------------------------------------
preprocess = { cmd = "python -u src/preprocess.py --config configs/flow_sr.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
convert-access = { cmd = "python -u derived/convert_access_to_training_grid.py", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }

# --- smoke tests (a handful of optimiser steps) -------------------------
smoke-flow = { cmd = "python -u src/train_flow.py --config configs/flow_sr.json --smoke-steps 3 --device cpu", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
smoke-flow-ar = { cmd = "python -u src/train_flow_ar.py --config configs/flow_ar.json --smoke-steps 3 --device cpu", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
smoke-gan = { cmd = "python -u src/train_gan.py --config configs/gan_sr.json --smoke-steps 3 --device cpu", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
smoke-gan-v2 = { cmd = "python -u src/train_gan.py --config configs/gan_sr_v2.json --smoke-steps 3 --device cpu", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
smoke-gan-v2b = { cmd = "python -u src/train_gan.py --config configs/gan_sr_v2b_image_only_critic.json --smoke-steps 3 --device cpu", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
smoke-gan-v3 = { cmd = "python -u src/train_gan.py --config configs/gan_sr_v3_hard_consistency.json --smoke-steps 3 --device cpu", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }

# --- production training (submit through jobs/*.pbs) --------------------
train-flow = { cmd = "python -u src/train_flow.py --config configs/flow_sr.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
train-flow-ar = { cmd = "python -u src/train_flow_ar.py --config configs/flow_ar.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
train-gan = { cmd = "python -u src/train_gan.py --config configs/gan_sr.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
train-gan-v2 = { cmd = "python -u src/train_gan.py --config configs/gan_sr_v2.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
train-gan-v2b = { cmd = "python -u src/train_gan.py --config configs/gan_sr_v2b_image_only_critic.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
train-gan-v3 = { cmd = "python -u src/train_gan.py --config configs/gan_sr_v3_hard_consistency.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
preprocess-combined = { cmd = "python -u src/preprocess_combined.py --config configs/flow_sr_combined_hist_rcp85_continue_320k.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
train-flow-combined = { cmd = "python -u src/train_flow.py --config configs/flow_sr_combined_hist_rcp85_continue_320k.json", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }

# --- evaluation ---------------------------------------------------------
evaluate-flow = { cmd = "python -u src/evaluate.py --run runs/flow_sr", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
evaluate-flow-ar = { cmd = "python -u src/evaluate.py --run runs/flow_ar", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
evaluate-gan = { cmd = "python -u src/evaluate.py --run runs/gan_sr", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
evaluate-gan-v2 = { cmd = "python -u src/evaluate.py --run runs/gan_sr_v2", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
evaluate-gan-v2b = { cmd = "python -u src/evaluate.py --run runs/gan_sr_v2b_image_only_critic", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
evaluate-gan-v3 = { cmd = "python -u src/evaluate.py --run runs/gan_sr_v3_hard_consistency", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
infer-access-historical = { cmd = "python -u src/infer_access_cm2.py --config configs/access_cm2_inference.json --period-name historical", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
infer-access-future = { cmd = "python -u src/infer_access_cm2.py --config configs/access_cm2_inference.json --period-name future", env = { PYTHONPATH = "src", MPLBACKEND = "Agg" } }
